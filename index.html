<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أنشطة المدينة - لوحة الرحلة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-darkest: #000814;
      --c-dark: #001d3d;
      --c-blue: #003566;
      --c-gold: #ffc300;
      --c-yellow: #ffd60a;
      --bg-body: #000814;
      --card-bg: rgba(0, 29, 61, 0.7);
      --border-col: rgba(255, 195, 0, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(white 1px, transparent 0),
        radial-gradient(rgba(255,214,10,0.5) 1px, transparent 0);
      background-size: 50px 50px;
      background-position: 0 0, 25px 25px;
      padding-bottom: 3rem;
    }

    /* الهيدر */
    header {
      background: linear-gradient(135deg, var(--c-darkest), var(--c-dark));
      border-bottom: 2px solid var(--c-gold);
      padding: 1.5rem 1rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    header h1 { font-size: 2.2rem; font-weight: 900; color: var(--c-yellow); text-shadow: 0 0 10px rgba(255,214,10,0.4); }
    header p { color: var(--text-muted); font-size: 1rem; margin-top: 0.3rem; }

    /* شريط الأيام */
    .days-bar {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      padding: 1rem;
      background: rgba(0, 29, 61, 0.9);
      border-bottom: 1px solid var(--border-col);
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .day-btn {
      background: var(--c-blue);
      color: var(--text-main);
      border: 1px solid var(--c-gold);
      padding: 0.5rem 1.2rem;
      border-radius: 99px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }
    .day-btn:hover, .day-btn.active {
      background: var(--c-gold);
      color: var(--c-darkest);
      box-shadow: 0 0 15px rgba(255,195,0,0.6);
      transform: translateY(-2px);
    }

    .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }

    /* شاشة الإعلانات العلوية (تتغير كل 10 ثواني) */
    .ad-screen {
      background: linear-gradient(145deg, var(--c-dark), var(--c-blue));
      border: 2px solid var(--c-gold);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .ad-screen::before {
      content: '⭐ شاشة عرض المجموعات التفاعلية';
      position: absolute;
      top: 10px; right: 15px;
      font-size: 0.75rem;
      color: var(--c-yellow);
      background: rgba(0,0,0,0.3);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .ad-content h2 { color: var(--c-yellow); font-size: 1.8rem; margin-bottom: 0.5rem; }
    .ad-content p { color: var(--text-main); font-size: 1.1rem; line-height: 1.6; }
    .ad-students-tag {
      margin-top: 0.8rem;
      background: rgba(255,195,0,0.15);
      border: 1px dashed var(--c-gold);
      padding: 5px 15px;
      border-radius: 10px;
      font-size: 0.9rem;
      color: var(--c-yellow);
    }

    /* قسم المجموعات المصغرة في الأسفل */
    .section-title { font-size: 1.4rem; color: var(--c-yellow); margin-bottom: 1rem; border-right: 4px solid var(--c-gold); padding-right: 10px; }
    .groups-mini-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }
    .group-mini-card {
      background: var(--card-bg);
      border: 1px solid var(--border-col);
      border-radius: 16px;
      padding: 1.2rem;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .group-mini-card:hover {
      border-color: var(--c-gold);
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(0,53,102,0.8);
    }
    .group-mini-card h3 { color: var(--c-yellow); font-size: 1.2rem; margin-bottom: 0.4rem; }
    .group-mini-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }
    
    .btn-gold {
      background: var(--c-gold);
      color: var(--c-darkest);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-gold:hover { background: var(--c-yellow); }

    /* تفاصيل المجموعة المفردة (عند الدخول لها) */
    .group-detail-view {
      background: var(--card-bg);
      border: 2px solid var(--c-gold);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .back-btn {
      background: transparent;
      border: 1px solid var(--text-muted);
      color: var(--text-main);
      padding: 0.4rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 1rem;
    }
    .back-btn:hover { border-color: var(--c-gold); color: var(--c-gold); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    .panel-box {
      background: rgba(0, 8, 20, 0.6);
      border: 1px solid var(--border-col);
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .panel-box h4 { color: var(--c-yellow); margin-bottom: 0.8rem; border-bottom: 1px dashed var(--border-col); padding-bottom: 5px; }

    .input-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    input, select, textarea {
      flex: 1;
      background: #000814;
      border: 1px solid var(--border-col);
      color: white;
      padding: 0.5rem;
      border-radius: 8px;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--c-gold); outline: none; }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.03);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .badge-leader { background: var(--c-gold); color: var(--c-darkest); padding: 2px 8px; border-radius: 4px; font-weight: 800; font-size: 0.8rem; }
    
    .activity-card {
      background: rgba(0,29,61,0.6);
      border: 1px solid var(--border-col);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .activity-card h5 { color: var(--c-yellow); font-size: 1.1rem; }
    .meta-tag { font-size: 0.8rem; color: var(--text-muted); background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; }
  </style>
</head>
<body>

  <header>
    <h1>🏙️ أنشطة المدينة</h1>
    <p>بوابة متابعة المجموعات والفعاليات خلال أيام الرحلة الخمسة</p>
  </header>

  <div class="days-bar" id="daysBar"></div>

  <div class="container" id="mainContainer">
    <!-- المحتوى يتغير ديناميكياً هنا -->
  </div>

  <script>
    const DAYS = [
      { id: 'd1', name: 'اليوم الأول: القرآني' },
      { id: 'd2', name: 'اليوم الثاني: خير جليس' },
      { id: 'd3', name: 'اليوم الثالث: الحفظ' },
      { id: 'd4', name: 'اليوم الرابع: المهارات' },
      { id: 'd5', name: 'اليوم الخامس: المفتوح' }
    ];

    let currentDay = 'd1';
    let activeGroupView = null; // رقم المجموعة المعروضة تفصيلياً أو null للرئيسية
    let adIndex = 0;
    let adInterval = null;

    // جلب أو تهيئة بيانات المجموعات الـ 9
    let db = JSON.parse(localStorage.getItem('madinah_trip_db')) || initDB();

    function initDB() {
      const data = {};
      DAYS.forEach(day => {
        data[day.id] = {};
        for(let i=1; i<=9; i++) {
          data[day.id][i] = {
            leader: 'لم يُحدد بعد',
            members: ['طالب 1', 'طالب 2', 'طالب 3'],
            activities: [
              { id: 1, title: 'حلقة التلاوة الكبرى', idea: 'مراجعة الجزء المقرّر', needs: 'المصحف الشريف, دفتر ملاحظات', date: '١٤٤٨/٠٦/٠٨ هـ', type: 'individual', assignee: 'طالب 1', score: 95, grade: 95 }
            ]
          };
        }
      });
      return data;
    }

    function saveDB() {
      localStorage.setItem('madinah_trip_db', JSON.stringify(db));
      render();
    }

    function setDay(dayId) {
      currentDay = dayId;
      activeGroupView = null;
      render();
    }

    function openGroup(gNum) {
      activeGroupView = gNum;
      render();
    }

    function closeGroup() {
      activeGroupView = null;
      render();
    }

    // إدارة الأعضاء والقائد
    fnAddMember = (gNum, input) => {
      let val = input.value.trim();
      if(!val) return;
      db[currentDay][gNum].members.push(val);
      input.value = '';
      saveDB();
    }

    fnSetLeader = (gNum, name) => {
      db[currentDay][gNum].leader = name;
      saveDB();
    }

    fnRemoveMember = (gNum, idx) => {
      db[currentDay][gNum].members.splice(idx, 1);
      saveDB();
    }

    // إضافة نشاط جديد
    fnAddActivity = (gNum, form) => {
      let title = form.querySelector('.act-title').value.trim();
      let idea = form.querySelector('.act-idea').value.trim();
      let needs = form.querySelector('.act-needs').value.trim();
      let date = form.querySelector('.act-date').value.trim();
      let type = form.querySelector('.act-type').value;
      let assignee = form.querySelector('.act-assignee').value;
      let score = parseInt(form.querySelector('.act-score').value) || 100;

      if(!title) return;

      db[currentDay][gNum].activities.push({
        id: Date.now(),
        title, idea, needs, date, type, assignee, score, grade: score
      });
      form.reset();
      saveDB();
    }

    // نظام الإعلانات التلقائي كل 10 ثواني للشاشة العلوية
    function startAdRotator() {
      if(adInterval) clearInterval(adInterval);
      adInterval = setInterval(() => {
        if(activeGroupView === null) {
          adIndex = (adIndex % 9) + 1; // من 1 إلى 9
          updateAdScreen();
        }
      }, 10000);
    }

    function updateAdScreen() {
      const adEl = document.getElementById('adScreenContent');
      if(!adEl) return;
      let gData = db[currentDay][adIndex];
      let lastAct = gData.activities[gData.activities.length - 1];
      adEl.innerHTML = `
        <h2>✨ المجموعة رقم (${adIndex})</h2>
        <p><strong>القائد:</strong> ${gData.leader} | <strong>عدد الطلاب:</strong> ${gData.members.length + 1}</p>
        <div class="ad-students-tag">
          👤 <strong>الطلاب:</strong> ${gData.leader}, ${gData.members.join(', ')}
        </div>
        ${lastAct ? `<p style="margin-top:0.6rem; font-size:0.95rem; color:var(--c-yellow);">آخر نشاط منفذ: ${lastAct.title} (الدرجة: ${lastAct.score}/100)</p>` : ''}
      `;
    }

    function render() {
      // 1. رسم شريط الأيام
      const daysBar = document.getElementById('daysBar');
      daysBar.innerHTML = DAYS.map(d => `
        <button class="day-btn ${d.id === currentDay ? 'active' : ''}" onclick="setDay('${d.id}')">${d.name}</button>
      `).join('');

      const container = document.getElementById('mainContainer');

      if(activeGroupView === null) {
        // الصفحة الرئيسية
        container.innerHTML = `
          <div class="ad-screen">
            <div class="ad-content" id="adScreenContent"></div>
          </div>

          <h3 class="section-title">مجموعات الرحلة التسع (اختر مجموعة للاطلاع والتعديل)</h3>
          <div class="groups-mini-grid" id="groupsGrid"></div>
        `;

        // تعبئة المجموعات المصغرة في الأسفل
        const groupsGrid = document.getElementById('groupsGrid');
        groupsGrid.innerHTML = '';
        for(let i=1; i<=9; i++) {
          let g = db[currentDay][i];
          groupsGrid.innerHTML += `
            <div class="group-mini-card">
              <div>
                <h3>المجموعة (${i})</h3>
                <p><strong>القائد:</strong> ${g.leader}<br><strong>الطلاب:</strong> ${g.members.length + 1} طلاب<br><strong>الأنشطة المسجلة:</strong> ${g.activities.length}</p>
              </div>
              <button class="btn-gold" onclick="openGroup(${i})">فتح لوحة المجموعة ➔</button>
            </div>
          `;
        }

        updateAdScreen();
        startAdRotator();

      } else {
        // صفحة تفاصيل المجموعة المختارة
        if(adInterval) clearInterval(adInterval);
        let g = db[currentDay][activeGroupView];
        let allStudents = [g.leader, ...g.members].filter(s => s && s !== 'لم يُحدد بعد');

        container.innerHTML = `
          <button class="back-btn" onclick="closeGroup()">⬅ العودة للرئيسية وشاشة المجموعات</button>
          <div class="group-detail-view">
            <h2 style="color:var(--c-yellow); margin-bottom:1rem;">⚙️ لوحة تحكم المجموعة (${activeGroupView})</h2>
            
            <div class="grid-2">
              <div>
                <!-- إدارة القائد والأعضاء -->
                <div class="panel-box">
                  <h4>👑 قائد المجموعة</h4>
                  <select onchange="fnSetLeader(${activeGroupView}, this.value)">
                    <option value="${g.leader}">${g.leader} (الحالي)</option>
                    ${g.members.map(m => `<option value="${m}">${m}</option>`).join('')}
                  </select>
                </div>

                <div class="panel-box">
                  <h4>👥 أعضاء المجموعة (${g.members.length})</h4>
                  <div style="max-height:150px; overflow-y:auto; margin-bottom:0.5rem;">
                    ${g.members.map((m, idx) => `
                      <div class="list-item">
                        <span>👤 ${m}</span>
                        <button class="back-btn" style="padding:2px 6px; font-size:0.75rem;" onclick="fnRemoveMember(${activeGroupView}, ${idx})">حذف</button>
                      </div>
                    `).join('')}
                  </div>
                  <div class="input-row">
                    <input type="text" id="newMemberInp" placeholder="اسم طالب جديد...">
                    <button class="btn-gold" style="width:auto;" onclick="fnAddMember(${activeGroupView}, document.getElementById('newMemberInp'))">إضافة</button>
                  </div>
                </div>
              </div>

              <div>
                <!-- إضافة نشاط جديد -->
                <div class="panel-box">
                  <h4>📌 إضافة نشاط جديد للمجموعة</h4>
                  <form onsubmit="event.preventDefault(); fnAddActivity(${activeGroupView}, this);">
                    <input type="text" class="act-title" placeholder="اسم النشاط..." required style="margin-bottom:0.5rem; width:100%;">
                    <textarea class="act-idea" placeholder="فكرة النشاط..." style="margin-bottom:0.5rem; width:100%; height:60px;"></textarea>
                    <input type="text" class="act-needs" placeholder="الأشياء التي يحتاجها (البنود: مقص، ورق، قلم...)" style="margin-bottom:0.5rem; width:100%;">
                    <div class="input-row" style="margin-bottom:0.5rem;">
                      <input type="text" class="act-date" placeholder="زمن النشاط (تقويم هجري: ١٤٤٨/٠٦/...)" style="width:100%;">
                    </div>
                    <div class="input-row" style="margin-bottom:0.5rem;">
                      <select class="act-type" onchange="this.form.querySelector('.act-assignee').style.display = this.value==='individual' ? 'block' : 'none'">
                        <option value="group">نشاط جماعي (للكامل)</option>
                        <option value="individual">نشاط فردي (لطالب محدد)</option>
                      </select>
                      <select class="act-assignee" style="display:none;">
                        ${allStudents.map(s => `<option value="${s}">${s}</option>`).join('')}
                      </select>
                    </div>
                    <div class="input-row" style="margin-bottom:0.8rem;">
                      <span style="font-size:0.85rem; align-self:center;">الدرجة (من 100):</span>
                      <input type="number" class="act-score" value="100" min="0" max="100" style="max-width:80px;">
                    </div>
                    <button type="submit" class="btn-gold">حفظ وإضافة النشاط</button>
                  </form>
                </div>
              </div>
            </div>

            <!-- قائمة الأنشطة المسجلة -->
            <div class="panel-box" style="margin-top:1.5rem;">
              <h4>📋 أنشطة المجموعة المسجلة</h4>
              ${g.activities.length === 0 ? '<p style="color:var(--text-muted); text-align:center; padding:1rem;">لا توجد أنشطة مسجلة بعد لهذه المجموعة.</p>' : ''}
              ${g.activities.map(act => `
                <div class="activity-card">
                  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <h5>${act.title}</h5>
                    <span style="background:var(--c-gold); color:var(--c-darkest); padding:2px 8px; border-radius:6px; font-weight:800; font-size:0.85rem;">الدرجة: ${act.grade}/100</span>
                  </div>
                  <p style="font-size:0.9rem; margin:0.4rem 0;"><strong>الفكرة:</strong> ${act.idea || '—'}</p>
                  <p style="font-size:0.9rem; margin:0.4rem 0;"><strong>البنود والمتطلبات:</strong> ${act.needs || '—'}</p>
                  <div>
                    <span class="meta-tag">📅 ${act.date || 'بدون تاريخ'}</span>
                    <span class="meta-tag">🏷️ ${act.type === 'individual' ? 'فردي (' + act.assignee + ')' : 'جماعي (للمجموعة)'}</span>
                  </div>
                </div>
              `).join('')}
            </div>

          </div>
        `;
      }
    }

    render();
  </script>
</body>
</html>
