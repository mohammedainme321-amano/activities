<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أنشطة المدينة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens: strict blue monochrome ===== */
:root{
  --navy:#03045e; --royal:#023e8a; --ocean:#0077b6; --cerulean:#0096c7; --cyan:#00b4d8;
  --sky:#48cae4; --aqua:#90e0ef; --pale:#ade8f4; --ice:#caf0f8;
  --gold:#f5b301; /* reserved ONLY for winner “Star” badges */
  --white:#ffffff; --offwhite:#f4fcfe;

  --bg:var(--offwhite); --surface:var(--white); --surface-2:var(--ice);
  --text:var(--navy); --text-soft:var(--royal); --line:var(--aqua);
  --chip-bg:var(--white); --chip-text:var(--royal); --chip-line:var(--aqua);
  --chip-active-bg:var(--navy); --chip-active-text:var(--white);
  --hero-from:var(--navy); --hero-to:var(--ocean);
  --clock-text:var(--ice); --title-text:var(--white);
  --radius:18px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#020447; --surface:var(--royal); --surface-2:var(--navy);
    --text:var(--ice); --text-soft:var(--pale); --line:var(--ocean);
    --chip-bg:var(--navy); --chip-text:var(--pale); --chip-line:var(--ocean);
    --chip-active-bg:var(--cyan); --chip-active-text:var(--navy);
    --hero-from:var(--navy); --hero-to:var(--royal);
  }
}
:root[data-theme="dark"]{
  --bg:#020447; --surface:var(--royal); --surface-2:var(--navy);
  --text:var(--ice); --text-soft:var(--pale); --line:var(--ocean);
  --chip-bg:var(--navy); --chip-text:var(--pale); --chip-line:var(--ocean);
  --chip-active-bg:var(--cyan); --chip-active-text:var(--navy);
  --hero-from:var(--navy); --hero-to:var(--royal);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:'Cairo','Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;
  line-height:1.7;-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero-from);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* ===== Header ===== */
.app-header{background:linear-gradient(160deg,var(--hero-from),var(--hero-to));color:var(--title-text);padding:14px 16px 28px}
.topbar{max-width:1100px;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--cyan);color:var(--navy);display:grid;place-items:center;font-weight:900}
.theme-btn{background:transparent;border:1.5px solid var(--sky);color:var(--ice);border-radius:999px;padding:4px 14px;font-weight:600;font-size:.9rem}
.theme-btn:hover{background:var(--royal)}
.sync-pill{font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--ice);border:1px solid var(--sky);white-space:nowrap}
.sync-pill.err{background:#7f1d1d;border-color:#fca5a5;color:#fee2e2}
.sync-pill.ok{background:rgba(0,180,216,.2);border-color:var(--cyan);color:var(--white)}

/* Day selector */
.days-wrap{max-width:1100px;margin:0 auto;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.days{display:flex;gap:10px;min-width:max-content;margin:0 auto;justify-content:center}
.day-chip{
  display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:start;
  background:var(--chip-bg);color:var(--chip-text);border:1.5px solid var(--chip-line);
  border-radius:var(--radius);padding:8px 16px;min-width:150px;transition:background .2s,color .2s,transform .15s;
}
.day-chip small{font-size:.78rem;font-weight:600;opacity:.8}
.day-chip strong{font-size:1rem;font-weight:700}
.day-chip:hover{transform:translateY(-2px)}
.day-chip[aria-selected="true"]{background:var(--chip-active-bg);color:var(--chip-active-text);border-color:var(--chip-active-bg);box-shadow:0 6px 18px rgba(3,4,94,.35)}

/* Hero: active title + clock */
.hero{max-width:1100px;margin:18px auto 0;text-align:center}
.active-title{margin:0;font-size:clamp(1.2rem,3.6vw,1.7rem);font-weight:700;color:var(--title-text);letter-spacing:0}
.active-sub{margin:2px 0 0;color:var(--pale);font-size:.95rem;font-weight:400}
.clock{
  direction:ltr;unicode-bidi:isolate;margin:8px 0 0;
  font-size:clamp(3rem,13vw,5.6rem);font-weight:900;line-height:1.1;
  color:var(--clock-text);font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.clock-label{margin:0;color:var(--aqua);font-size:.85rem;font-weight:600}

/* ===== Main view ===== */
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:28px 22px;text-align:center}
.panel h2{margin:0 0 6px;font-size:1.3rem;color:var(--text)}
.panel p{margin:0;color:var(--text-soft)}
  .day-acts{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;text-align:start}
.day-act-card{background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.day-act-card h3{margin:0 0 4px;font-size:1.05rem;color:var(--text)}
.day-act-sup{margin:0 0 10px;font-size:.88rem;color:var(--text-soft);font-weight:600}
.day-act-list{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px}
.day-act-list li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.92rem}
.day-act-pts{font-weight:700;color:var(--ocean);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .day-act-pts{color:var(--sky)}}
:root[data-theme="dark"] .day-act-pts{color:var(--sky)}
  
/* ===== Statistics billboard ===== */
.bb{background:linear-gradient(150deg,var(--navy),var(--royal));color:var(--ice);border:1.5px solid var(--ocean);border-radius:24px;padding:18px;margin-bottom:24px}
.bb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bb-label{margin:0;font-weight:700;color:var(--aqua);font-size:1rem}
.bb-nav{display:flex;gap:8px;align-items:center}
.bb-arrow{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--sky);background:var(--navy);color:var(--ice);font-size:1.1rem;line-height:1}
.bb-arrow:hover{background:var(--ocean)}
.bb-progress{height:5px;background:var(--ocean);border-radius:99px;overflow:hidden;margin:12px 0 14px}
.bb-progress i{display:block;height:100%;width:0;background:var(--sky)}
.bb-dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.bb-dot{width:11px;height:11px;padding:0;border-radius:50%;border:1.5px solid var(--sky);background:transparent}
.bb-dot[aria-current="true"]{background:var(--cyan);border-color:var(--cyan)}
.bb-card{border:2px solid var(--ocean);border-radius:20px;padding:16px;background:var(--navy)}
.bb-card.is-best{border-color:var(--gold)}
.bb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bb-gname{margin:0;font-size:clamp(1.6rem,5.5vw,2.5rem);font-weight:900;color:var(--white);line-height:1.3}
.bb-total{text-align:center;background:var(--royal);border-radius:16px;padding:6px 20px}
.bb-total b{display:block;font-size:2.2rem;font-weight:900;color:var(--white);line-height:1.2;font-variant-numeric:tabular-nums}
.bb-total span{font-size:.8rem;color:var(--pale);font-weight:600}
.badge-star{display:inline-flex;align-items:center;gap:4px;background:var(--gold);color:var(--navy);font-weight:900;font-size:.8rem;padding:1px 10px;border-radius:999px;white-space:nowrap}
.bb-leader{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0;padding:10px 14px;border-radius:14px;background:var(--royal);border:1.5px solid var(--ocean)}
.bb-leader.is-best{border-color:var(--gold)}
.bb-role{font-size:.8rem;color:var(--aqua);font-weight:600;display:block}
.bb-pname{font-weight:700;color:var(--white);font-size:1.1rem}
.pts{font-weight:900;color:var(--sky);font-variant-numeric:tabular-nums;white-space:nowrap}
.pts small{font-weight:600;font-size:.75rem;color:var(--pale);margin-inline-start:3px}
.bb-students{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;list-style:none;margin:0;padding:0}
.stu{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-radius:12px;background:var(--royal);border:1.5px solid transparent}
.stu.is-best{border-color:var(--gold)}
.stu .bb-pname{font-size:1rem}
.bb-empty{padding:18px;text-align:center;color:var(--pale);border:1.5px dashed var(--ocean);border-radius:12px}
.bb-spot{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin-top:14px}
.spot{background:var(--royal);border-radius:12px;padding:8px 12px;font-size:.92rem;color:var(--ice)}
.spot b{color:var(--white)}
.bb-tools{display:flex;gap:8px;justify-content:center;margin-top:12px}
.bb-tools button{background:transparent;border:1.5px solid var(--ocean);color:var(--pale);border-radius:999px;padding:2px 14px;font-size:.8rem}
.bb-tools button:hover{background:var(--ocean);color:var(--white)}
/* ===== Group grid, detail view, transitions ===== */
@keyframes viewIn{from{opacity:0;transform:translate(var(--dx,0px),10px)}to{opacity:1;transform:none}}
.view-enter{animation:viewIn .28s ease both}
.btn{display:inline-block;background:var(--chip-active-bg);color:var(--chip-active-text);border:1.5px solid var(--chip-active-bg);border-radius:12px;padding:6px 16px;font-weight:700;text-decoration:none;font-size:.95rem}
.btn:hover{filter:brightness(1.12)}
.btn-ghost{background:var(--chip-bg);color:var(--chip-text);border-color:var(--chip-line)}
.bb-link{color:inherit;text-decoration:none}.bb-link:hover{text-decoration:underline}
.sec-title{margin:0 0 12px;font-size:1.3rem;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.g-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px}
.g-card.is-best{border-color:var(--gold)}
.g-card h3{margin:0;font-size:1.15rem;color:var(--text)}
.g-meta{margin:0;color:var(--text-soft);font-size:.92rem}
.g-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.g-card .pts,.d-fld .pts{color:var(--ocean)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .g-card .pts{color:var(--sky)}}
:root[data-theme="dark"] .g-card .pts{color:var(--sky)}
.d-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.d-switch{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.d-switch select,.d-in{font:inherit;background:var(--surface-2);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0}
.d-team{background:linear-gradient(150deg,var(--navy),var(--royal));color:var(--ice);border:2px solid var(--ocean);border-radius:24px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.d-team.is-best{border-color:var(--gold)}
.d-lab{display:block;font-size:.85rem;color:var(--aqua);font-weight:600}
.d-team h2{margin:0;font-size:clamp(1.8rem,6vw,3rem);font-weight:900;color:var(--white);line-height:1.3}
.d-team .bb-total b{font-size:2.4rem}
.d-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.d-cols{grid-template-columns:1fr}}
.d-col{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.d-col h3{margin:0;font-size:1.05rem;color:var(--text)}
.d-fld{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--text-soft);font-weight:600}
.d-row{display:flex;gap:8px;align-items:center}
.d-row .d-in:first-child{flex:1}
.d-pts{width:82px;text-align:center}
.d-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.d-rm{background:transparent;border:1.5px solid var(--line);color:var(--text-soft);border-radius:10px;width:34px;height:34px}
.d-rm:hover{background:var(--surface-2)}
.d-eval{border-style:dashed;text-align:center;color:var(--text-soft);min-height:180px;justify-content:center}
.d-day{margin:0 0 16px;text-align:center;font-size:clamp(1.1rem,3.4vw,1.4rem);font-weight:700;color:var(--text)}
.d-head{margin:0;padding-bottom:8px;border-bottom:1.5px solid var(--line);font-size:1.05rem;color:var(--text)}
.d-row .d-in:not(.d-pts){flex:1}
.d-edit{margin-top:6px;padding:2px 12px;font-size:.85rem}
.d-leader{border:1.5px dashed var(--line);border-radius:14px;padding:10px}
.d-hint{font-weight:400;font-size:.8rem;color:var(--text-soft)}
.d-grip{flex:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--text-soft);padding:6px 5px;border-radius:8px;font-weight:900;letter-spacing:-2px;line-height:1}
.d-grip:hover{background:var(--surface-2)}
.d-grip:active{cursor:grabbing}
.d-row.dragging{opacity:.35}
.d-ghost{position:fixed;z-index:50;pointer-events:none;background:var(--cyan);color:var(--navy);font-weight:700;padding:8px 14px;border-radius:12px;box-shadow:0 10px 24px rgba(3,4,94,.35);transform:rotate(-2deg)}
.drop-hot{box-shadow:0 0 0 3px var(--cyan);background:color-mix(in srgb,var(--aqua) 35%,transparent);border-radius:12px}
.drop-before{box-shadow:0 -4px 0 var(--cyan)}
.drop-after{box-shadow:0 4px 0 var(--cyan)}
.d-tray{position:fixed;inset-inline:0;bottom:0;z-index:40;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--navy);border-top:2px solid var(--cyan);color:var(--ice);font-weight:700}
.d-tray[hidden]{display:none}
.d-chip{flex:none;font:inherit;font-weight:700;background:var(--royal);color:var(--ice);border:1.5px solid var(--ocean);border-radius:999px;padding:6px 14px}
.d-chip.drop-hot{background:var(--cyan);color:var(--navy);box-shadow:0 0 0 3px var(--aqua)}
.ev-main{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ev-main button{font:inherit;font-weight:700;padding:10px 8px;border-radius:14px;background:var(--chip-bg);color:var(--chip-text);border:1.5px solid var(--chip-line)}
.ev-main button[aria-pressed="true"]{background:var(--chip-active-bg);color:var(--chip-active-text);border-color:var(--chip-active-bg)}
.ev-sub{display:flex;gap:6px;flex-wrap:wrap}
.ev-sub button{font:inherit;font-weight:600;font-size:.9rem;padding:5px 12px;border-radius:999px;background:transparent;color:var(--text-soft);border:1.5px solid var(--line)}
.ev-sub button[aria-pressed="true"]{background:var(--ocean);color:var(--white);border-color:var(--ocean)}
.ev-day{margin:0;font-size:.9rem;color:var(--text-soft);font-weight:600}
.ev-score{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;background:linear-gradient(150deg,var(--navy),var(--royal));color:var(--ice);border-radius:16px;padding:10px 16px}
.ev-score b{font-size:2rem;font-weight:900;color:var(--white);direction:ltr;font-variant-numeric:tabular-nums}
.ev-wrap{overflow-x:auto}
.ev-table{width:100%;border-collapse:collapse;min-width:420px}
.ev-table th,.ev-table td{padding:8px 10px;border-bottom:1.5px solid var(--line);text-align:start;color:var(--text)}
.ev-table th{background:var(--surface-2);font-size:.9rem;white-space:nowrap}
.ev-table td.c,.ev-table th.c{text-align:center}
.ev-table input[type=checkbox]{width:22px;height:22px;accent-color:var(--ocean);cursor:pointer}
.ev-table tfoot td{font-weight:900;background:var(--surface-2)}
.ev-table .d-in{width:100%}
.act-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.act-head h3{margin:0;font-size:1.2rem;color:var(--text)}
.act-title{margin:0;font-weight:900;font-size:1.15rem;color:var(--ocean)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .act-title{color:var(--sky)}}
:root[data-theme="dark"] .act-title{color:var(--sky)}
.act-toggle{justify-content:center}
.act-count{font-size:.85rem;color:var(--text-soft);font-weight:600}
.mp-grid{display:flex;flex-wrap:wrap;gap:6px}
.mp-btn{width:42px;height:42px;border-radius:12px;font:inherit;font-weight:900;background:var(--chip-bg);color:var(--chip-text);border:1.5px solid var(--chip-line)}
.mp-btn[aria-pressed="true"]{background:var(--cyan);color:var(--navy);border-color:var(--cyan)}
textarea.d-in{resize:vertical;min-height:64px}
.m-err{margin:0;color:var(--text);font-weight:700;font-size:.9rem;min-height:1.2em}
.m-pos{font-weight:900;color:var(--ocean);direction:ltr;display:inline-block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .m-pos{color:var(--sky)}}
:root[data-theme="dark"] .m-pos{color:var(--sky)}
.foot{max-width:1100px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line);display:flex;flex-direction:column;gap:10px}
.foot p{margin:0;color:var(--text-soft);font-size:.9rem}
.foot-btns{display:flex;gap:8px;flex-wrap:wrap}
.foot textarea{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;min-height:140px}
/* billboard: graduated palette + crossfade */
.bb{background-color:var(--bb-bg,var(--navy));background-image:linear-gradient(160deg,rgb(255 255 255/0),rgb(3 4 94/.35));transition:background-color .7s ease-in-out}
.bb-card{background:rgb(3 4 94/.72);border-color:var(--bb-ac,var(--ocean));transition:border-color .7s ease-in-out}
.bb-label{color:var(--white)}
.bb-progress{background:rgb(3 4 94/.55)}
.bb-progress i{background:var(--bb-ac,var(--sky));transition:width .1s linear,background-color .7s ease-in-out}
.bb-dot{transition:background-color .7s ease-in-out,border-color .7s ease-in-out}
.bb-dot[aria-current="true"]{background:var(--bb-ac,var(--cyan));border-color:var(--bb-ac,var(--cyan))}
.bb-stage{transition:opacity .32s ease-in-out,transform .32s ease-in-out}
.bb-stage.bb-out{opacity:0;transform:translateX(var(--gx,0px))}
@keyframes bbIn{from{opacity:0;transform:translateX(var(--gx,0px))}to{opacity:1;transform:none}}
.bb-stage.bb-in{animation:bbIn .38s ease-in-out both}
@media (prefers-reduced-motion:reduce){.bb,.bb-card,.bb-stage,.bb-dot,.bb-progress i{transition:none!important}.bb-stage.bb-in{animation:none}}
@media (prefers-reduced-motion:reduce){.view-enter{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="app-header">
  <div class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">م</span><span>أنشطة المدينة</span></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="sync-pill" id="syncStatus" role="status">جاري الاتصال...</span>
      <button class="theme-btn" id="syncNowBtn" type="button" aria-label="مزامنة الآن">مزامنة</button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="تبديل المظهر">المظهر</button>
    </div>
  </div>

  <nav class="days-wrap" aria-label="أيام البرنامج">
    <div class="days" id="days" role="tablist"></div>
  </nav>

  <section class="hero" aria-live="polite">

<script>
const SUPABASE_URL = 'https://copvxmmfifdjdqsotxrc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_C9SD2WS5j3ch2mcwTRmPBQ_jyGFxKWx';
const db = window.db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: false,
    autoRefreshToken: false
  }
});
</script>
  <script>
const CloudSync = {
  ready: false,
  syncTimer: null,
  isPushing: false,
  lastPushAt: 0,
  channel: null,

  setStatus(text, state = '') {
    const el = document.getElementById('syncStatus');
    if (!el) return;
    el.textContent = text;
    el.className = 'sync-pill' + (state ? ' ' + state : '');
  },

  hasLocalData() {
    const hasMembers = (State.groups || []).some(g =>
      (g.leader && (g.leader.name || '').trim()) ||
      (g.students && g.students.length > 0) ||
      (g.mgmtG && g.mgmtG.length > 0)
    );
    const hasActs = Object.values(State.acts || {}).some(a => (a && ((a.sup || '').trim() || (a.crit && a.crit.length))));
    const hasLacts = Object.values(State.lacts || {}).some(a => (a && a.crit && a.crit.length));
    return hasMembers || hasActs || hasLacts;
  },

  async pullAll(isInitial = false) {
    if (!window.db) {
      this.setStatus('غير متصل بالسحابة', 'err');
      return false;
    }
    if (this.isPushing || this.syncTimer) return false;

    try {
      const [
        { data: dbGroups, error: e1 },
        { data: dbMembers, error: e2 },
        { data: dbActivities, error: e3 },
        { data: dbCrit, error: e4 },
        { data: dbRoutine, error: e5 },
        { data: dbActEval, error: e6 },
        { data: dbMgmt, error: e7 },
        { data: dbLeadCrit, error: e8 },
        { data: dbLeadEval, error: e9 }
      ] = await Promise.all([
        db.from('groups').select('*').order('display_order', { ascending: true }),
        db.from('group_members').select('*').eq('is_active', true).order('display_order', { ascending: true }),
        db.from('activities').select('*').order('program_day_id', { ascending: true }).order('activity_index', { ascending: true }),
        db.from('activity_criteria').select('*').order('sort_order', { ascending: true }),
        db.from('routine_evaluations').select('*'),
        db.from('activity_evaluations').select('*'),
        db.from('management_points').select('*').order('awarded_at', { ascending: false }),
        db.from('leader_action_criteria').select('*').order('sort_order', { ascending: true }),
        db.from('leader_action_evaluations').select('*')
      ]);

      const firstErr = e1 || e2 || e3 || e4 || e5 || e6 || e7 || e8 || e9;
      if (firstErr) {
        console.warn('Supabase pull warning:', firstErr.message);
        this.setStatus('خطأ قراءة: ' + firstErr.message, 'err');
        return false;
      }

      const cloudHasContent = (Array.isArray(dbMembers) && dbMembers.length > 0) ||
                              (Array.isArray(dbCrit) && dbCrit.length > 0) ||
                              (Array.isArray(dbLeadCrit) && dbLeadCrit.length > 0) ||
                              (Array.isArray(dbMgmt) && dbMgmt.length > 0);

      // إذا كانت السحابة فارغة من الأعضاء/التقييمات والجهاز يحتوي على بيانات محلية، ارفع البيانات المحلية بدلاً من مسحها!
      if (isInitial && !cloudHasContent && this.hasLocalData()) {
        this.setStatus('جاري رفع بياناتك للسحابة...', '');
        await this.pushAll();
        return true;
      }

      if (Array.isArray(dbGroups) && dbGroups.length) {
        const membersByGroup = new Map();
        (dbMembers || []).forEach(m => {
          if (!membersByGroup.has(m.group_id)) membersByGroup.set(m.group_id, []);
          membersByGroup.get(m.group_id).push(m);
        });

        const routineByMember = new Map();
        (dbRoutine || []).forEach(r => {
          if (!routineByMember.has(r.member_id)) routineByMember.set(r.member_id, []);
          routineByMember.get(r.member_id).push(r);
        });

        const actEvalByMember = new Map();
        (dbActEval || []).forEach(ae => {
          if (!actEvalByMember.has(ae.member_id)) actEvalByMember.set(ae.member_id, []);
          actEvalByMember.get(ae.member_id).push(ae);
        });

        const leadEvalByMember = new Map();
        (dbLeadEval || []).forEach(le => {
          if (!leadEvalByMember.has(le.member_id)) leadEvalByMember.set(le.member_id, []);
          leadEvalByMember.get(le.member_id).push(le);
        });

        const mgmtByGroup = new Map();
        const mgmtByMember = new Map();
        (dbMgmt || []).forEach(mp => {
          if (mp.target_type === 'group') {
            if (!mgmtByGroup.has(mp.group_id)) mgmtByGroup.set(mp.group_id, []);
            mgmtByGroup.get(mp.group_id).push(mp);
          } else if (mp.member_id) {
            if (!mgmtByMember.has(mp.member_id)) mgmtByMember.set(mp.member_id, []);
            mgmtByMember.get(mp.member_id).push(mp);
          }
        });

        const buildEvals = (memberId) => {
          const evals = {};
          (routineByMember.get(memberId) || []).forEach(r => {
            const d = r.program_day_id;
            evals[d] = evals[d] || {};
            evals[d].routine = evals[d].routine || { c: Array(10).fill(false), n: Array(10).fill('') };
            const idx = (r.criterion_id || 1) - 1;
            if (idx >= 0 && idx < 10) {
              evals[d].routine.c[idx] = !!r.is_checked;
              evals[d].routine.n[idx] = r.notes || '';
            }
          });

          (actEvalByMember.get(memberId) || []).forEach(ae => {
            const crit = (dbCrit || []).find(c => c.id === ae.activity_criterion_id);
            const act = crit && (dbActivities || []).find(a => a.id === crit.activity_id);
            if (!crit || !act) return;
            const d = act.program_day_id;
            const aIdx = Math.max(0, (act.activity_index || 1) - 1);
            evals[d] = evals[d] || {};
            evals[d].act = evals[d].act || {};
            evals[d].act[aIdx] = evals[d].act[aIdx] || { c: {}, n: {} };
            evals[d].act[aIdx].c[crit.id] = !!ae.is_checked;
            evals[d].act[aIdx].n[crit.id] = ae.notes || '';
          });

          (leadEvalByMember.get(memberId) || []).forEach(le => {
            const lcrit = (dbLeadCrit || []).find(c => c.id === le.action_criterion_id);
            if (!lcrit) return;
            const d = lcrit.program_day_id;
            const kind = lcrit.category;
            evals[d] = evals[d] || {};
            evals[d].lead = evals[d].lead || {};
            evals[d].lead[kind] = evals[d].lead[kind] || { c: {}, n: {} };
            evals[d].lead[kind].c[lcrit.id] = !!le.is_checked;
            evals[d].lead[kind].n[lcrit.id] = le.notes || '';
          });

          (mgmtByMember.get(memberId) || []).forEach(mp => {
            const d = mp.program_day_id || 1;
            evals[d] = evals[d] || {};
            evals[d].mgmt = evals[d].mgmt || [];
            evals[d].mgmt.push({
              id: mp.id,
              pts: +mp.points || 0,
              reason: mp.reason || '',
              day: d,
              ts: mp.awarded_at ? new Date(mp.awarded_at).getTime() : Date.now()
            });
          });

          return evals;
        };

        State.groups = dbGroups.map((g, gIdx) => {
          const gMembers = membersByGroup.get(g.id) || [];
          const leaderRow = gMembers.find(m => m.role === 'leader');
          const studentRows = gMembers.filter(m => m.role === 'student');

          const leaderObj = {
            dbId: leaderRow ? leaderRow.id : null,
            name: leaderRow ? (leaderRow.full_name || '') : '',
            points: 0,
            evals: leaderRow ? buildEvals(leaderRow.id) : {}
          };

          const studentsObj = studentRows.map((s, sIdx) => ({
            id: s.id,
            dbId: s.id,
            displayOrder: s.display_order ?? sIdx,
            name: s.full_name || '',
            points: 0,
            evals: buildEvals(s.id)
          }));

          const grpMgmt = (mgmtByGroup.get(g.id) || []).map(mp => ({
            id: mp.id,
            pts: +mp.points || 0,
            reason: mp.reason || '',
            day: mp.program_day_id || 1,
            ts: mp.awarded_at ? new Date(mp.awarded_at).getTime() : Date.now()
          }));

          return {
            id: g.id,
            name: g.name || ('المجموعة ' + (gIdx + 1)),
            displayOrder: g.display_order ?? (gIdx + 1),
            leader: leaderObj,
            students: studentsObj,
            mgmtG: grpMgmt
          };
        });

        Store.set('groups', State.groups);
      }

      if (Array.isArray(dbActivities) && dbActivities.length) {
        const nextActs = {};
        dbActivities.forEach(a => {
          const key = `${a.program_day_id}-${Math.max(0, (a.activity_index || 1) - 1)}`;
          const crits = (dbCrit || [])
            .filter(c => c.activity_id === a.id)
            .map(c => ({ id: c.id, t: c.title || '' }));
          nextActs[key] = {
            dbId: a.id,
            sup: a.supervisor_name || '',
            crit: crits
          };
        });
        State.acts = nextActs;
        Store.set('acts', State.acts);
      }

      if (Array.isArray(dbLeadCrit)) {
        const nextLacts = {};
        dbLeadCrit.forEach(c => {
          const key = `${c.category}-${c.program_day_id}`;
          if (!nextLacts[key]) nextLacts[key] = { crit: [] };
          nextLacts[key].crit.push({ id: c.id, t: c.title || '' });
        });
        State.lacts = nextLacts;
        Store.set('lacts', State.lacts);
      }

      if (typeof scoreOf === 'function') {
        (State.groups || []).forEach(g => {
          if (g.leader) g.leader.points = scoreOf(g.leader);
          (g.students || []).forEach(s => { s.points = scoreOf(s); });
        });
        Store.set('groups', State.groups);
      }

      this.ready = true;
      this.setStatus('متصل بالسحابة ✓', 'ok');
      return true;
    } catch (err) {
      console.warn('Supabase pull error:', err);
      this.setStatus('تعذّر الاتصال بالسحابة', 'err');
      return false;
    }
  },

  async deleteMember(memberId) {
    if (!window.db || !memberId) return;
    const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
    if (!uuidRegex.test(String(memberId))) return;
    try {
      await db.from('group_members').delete().eq('id', String(memberId));
    } catch (e) {
      console.warn('Delete member warning:', e);
    }
  },

  schedulePush() {
    if (!window.db) return;
    this.setStatus('جاري الحفظ...', '');
    clearTimeout(this.syncTimer);
    this.syncTimer = setTimeout(() => {
      this.syncTimer = null;
      this.pushAll();
    }, 500);
  },

  async pushAll() {
    if (!window.db) return;
    if (this.isPushing) {
      this.schedulePush();
      return;
    }
    this.isPushing = true;
    let firstError = null;
    const trackErr = (label, err) => {
      if (err) {
        console.warn(`Supabase [${label}] error:`, err.message);
        if (!firstError) firstError = `${label}: ${err.message}`;
      }
    };

    try {
      // 1. المجموعات
      const groupPayload = (State.groups || []).map((g, idx) => ({
        id: g.id,
        name: (g.name || ('المجموعة ' + (idx + 1))).trim(),
        display_order: g.displayOrder ?? (idx + 1)
      }));
      if (groupPayload.length) {
        const { error } = await db.from('groups').upsert(groupPayload, { onConflict: 'id' });
        trackErr('groups', error);
      }

      // 2. القادة والطلاب (بدون حذف جماعي تلقائي حتى لا تضيع أي بيانات)
      const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      const memberPayload = [];

      for (const g of (State.groups || [])) {
        if (g.leader && (g.leader.name || '').trim()) {
          const lid = (g.leader.dbId && uuidRegex.test(g.leader.dbId)) ? g.leader.dbId : crypto.randomUUID();
          g.leader.dbId = lid;
          memberPayload.push({
            id: lid,
            group_id: g.id,
            role: 'leader',
            full_name: g.leader.name.trim(),
            display_order: 0,
            is_active: true
          });
        }
        (g.students || []).forEach((s, sIdx) => {
          const sid = (typeof s.id === 'string' && uuidRegex.test(s.id))
            ? s.id
            : ((s.dbId && uuidRegex.test(s.dbId)) ? s.dbId : crypto.randomUUID());
          s.id = sid;
          s.dbId = sid;
          memberPayload.push({
            id: sid,
            group_id: g.id,
            role: 'student',
            full_name: (s.name || '').trim() || 'طالب',
            display_order: sIdx + 1,
            is_active: true
          });
        });
      }

      if (memberPayload.length) {
        const { error } = await db.from('group_members').upsert(memberPayload, { onConflict: 'id' });
        trackErr('group_members', error);
      }

      // 3. الأنشطة ومعاييرها
      let { data: dbActs, error: actsErr } = await db.from('activities').select('id, program_day_id, activity_index');
      trackErr('activities', actsErr);

      // إذا كان جدول activities فارغاً في القاعدة، أنشئ صفوف الأنشطة الأساسية
      if (!actsErr && (!dbActs || dbActs.length === 0) && typeof ACT_DAYS !== 'undefined') {
        const seedActs = [];
        ACT_DAYS.forEach(d => {
          d.acts.forEach((title, idx) => {
            seedActs.push({
              program_day_id: d.id,
              activity_index: idx + 1,
              title: title,
              supervisor_name: ''
            });
          });
        });
        if (seedActs.length) {
          await db.from('activities').insert(seedActs);
          const res = await db.from('activities').select('id, program_day_id, activity_index');
          dbActs = res.data || [];
        }
      }

      const actMap = new Map();
      (dbActs || []).forEach(a => actMap.set(`${a.program_day_id}-${Math.max(0, (a.activity_index || 1) - 1)}`, a.id));

      const critPayload = [];
      for (const [key, def] of Object.entries(State.acts || {})) {
        const actId = actMap.get(key);
        if (actId && def.sup !== undefined) {
          const { error } = await db.from('activities').update({ supervisor_name: (def.sup || '').trim() }).eq('id', actId);
          trackErr('activities_update', error);
        }
        if (actId && Array.isArray(def.crit)) {
          def.crit.forEach((c, cIdx) => {
            const cid = uuidRegex.test(c.id) ? c.id : crypto.randomUUID();
            c.id = cid;
            critPayload.push({
              id: cid,
              activity_id: actId,
              title: (c.t || '').trim() || 'معيار',
              sort_order: cIdx + 1
            });
          });
        }
      }
      if (critPayload.length) {
        const { error } = await db.from('activity_criteria').upsert(critPayload, { onConflict: 'id' });
        trackErr('activity_criteria', error);
      }

      // 4. معايير القائد
      const leadCritPayload = [];
      for (const [key, def] of Object.entries(State.lacts || {})) {
        const [kind, dStr] = key.split('-');
        const dayId = +dStr;
        if (!['challenge', 'support'].includes(kind) || !dayId) continue;
        (def.crit || []).forEach((c, cIdx) => {
          const cid = uuidRegex.test(c.id) ? c.id : crypto.randomUUID();
          c.id = cid;
          leadCritPayload.push({
            id: cid,
            program_day_id: dayId,
            category: kind,
            title: (c.t || '').trim() || 'فعل',
            sort_order: cIdx + 1
          });
        });
      }
      if (leadCritPayload.length) {
        const { error } = await db.from('leader_action_criteria').upsert(leadCritPayload, { onConflict: 'id' });
        trackErr('leader_action_criteria', error);
      }

      // 5. التقييمات ونقاط الإدارة
      const routineRows = [];
      const actEvalRows = [];
      const leadEvalRows = [];
      const mgmtRows = [];

      const pushPersonEvals = (person, groupId, isLeader) => {
        if (!person || !person.dbId || !person.evals) return;
        for (const [dStr, ev] of Object.entries(person.evals)) {
          const dayId = +dStr;
          if (!dayId || !ev) continue;

          if (ev.routine && Array.isArray(ev.routine.c)) {
            for (let i = 0; i < 10; i++) {
              routineRows.push({
                member_id: person.dbId,
                program_day_id: dayId,
                criterion_id: i + 1,
                is_checked: !!ev.routine.c[i],
                notes: (ev.routine.n && ev.routine.n[i]) ? String(ev.routine.n[i]) : ''
              });
            }
          }

          if (!isLeader && ev.act) {
            for (const [iStr, aObj] of Object.entries(ev.act)) {
              const def = (State.acts || {})[`${dayId}-${iStr}`];
              if (!def || !Array.isArray(def.crit) || !aObj || !aObj.c) continue;
              def.crit.forEach(c => {
                if (!uuidRegex.test(c.id)) return;
                actEvalRows.push({
                  member_id: person.dbId,
                  activity_criterion_id: c.id,
                  is_checked: !!aObj.c[c.id],
                  notes: (aObj.n && aObj.n[c.id]) ? String(aObj.n[c.id]) : ''
                });
              });
            }
          }

          if (isLeader && ev.lead) {
            for (const [kind, lObj] of Object.entries(ev.lead)) {
              const def = (State.lacts || {})[`${kind}-${dayId}`];
              if (!def || !Array.isArray(def.crit) || !lObj || !lObj.c) continue;
              def.crit.forEach(c => {
                if (!uuidRegex.test(c.id)) return;
                leadEvalRows.push({
                  member_id: person.dbId,
                  action_criterion_id: c.id,
                  is_checked: !!lObj.c[c.id],
                  notes: (lObj.n && lObj.n[c.id]) ? String(lObj.n[c.id]) : ''
                });
              });
            }
          }

          if (!isLeader && Array.isArray(ev.mgmt)) {
            ev.mgmt.forEach(m => {
              const mid = uuidRegex.test(m.id) ? m.id : crypto.randomUUID();
              m.id = mid;
              mgmtRows.push({
                id: mid,
                group_id: groupId,
                program_day_id: m.day || dayId,
                target_type: 'student',
                member_id: person.dbId,
                points: Math.max(0, Math.min(10, +m.pts || 0)),
                reason: (m.reason || '').trim() || 'نقاط إدارة'
              });
            });
          }
        }
      };

      for (const g of (State.groups || [])) {
        pushPersonEvals(g.leader, g.id, true);
        (g.students || []).forEach(s => pushPersonEvals(s, g.id, false));
        (g.mgmtG || []).forEach(m => {
          const mid = uuidRegex.test(m.id) ? m.id : crypto.randomUUID();
          m.id = mid;
          mgmtRows.push({
            id: mid,
            group_id: g.id,
            program_day_id: m.day || 1,
            target_type: 'group',
            member_id: null,
            points: Math.max(0, Math.min(10, +m.pts || 0)),
            reason: (m.reason || '').trim() || 'نقاط إدارة'
          });
        });
      }

      if (routineRows.length) {
        const { error } = await db.from('routine_evaluations').upsert(routineRows, { onConflict: 'member_id,program_day_id,criterion_id' });
        trackErr('routine_evaluations', error);
      }
      if (actEvalRows.length) {
        const { error } = await db.from('activity_evaluations').upsert(actEvalRows, { onConflict: 'member_id,activity_criterion_id' });
        trackErr('activity_evaluations', error);
      }
      if (leadEvalRows.length) {
        const { error } = await db.from('leader_action_evaluations').upsert(leadEvalRows, { onConflict: 'member_id,action_criterion_id' });
        trackErr('leader_action_evaluations', error);
      }
      if (mgmtRows.length) {
        const { error } = await db.from('management_points').upsert(mgmtRows, { onConflict: 'id' });
        trackErr('management_points', error);
      }

      Store.set('groups', State.groups);
      Store.set('acts', State.acts);
      Store.set('lacts', State.lacts);
      this.lastPushAt = Date.now();

      if (firstError) {
        this.setStatus('خطأ حفظ: ' + firstError, 'err');
      } else {
        this.setStatus('تم الحفظ في السحابة ✓', 'ok');
      }
    } catch (err) {
      console.warn('Supabase push error:', err);
      this.setStatus('خطأ اتصال أثناء الحفظ', 'err');
    } finally {
      this.isPushing = false;
    }
  },

  subscribeRealtime() {
    if (!window.db || this.channel) return;
    this.channel = db
      .channel('madinah-live-sync')
      .on('postgres_changes', { event: '*', schema: 'public' }, async () => {
        // تجاهل إشعارات Realtime الناتجة عن نفس الجهاز خلال ثانيتين من الحفظ حتى لا تقطع الكتابة
        if (this.isPushing || this.syncTimer || (Date.now() - this.lastPushAt < 2500)) return;
        const ok = await this.pullAll(false);
        if (ok) {
          refreshVisibleUI();
        }
      })
      .subscribe();
  }
};
</script>
  
  
  <script>
/* ===== Data ===== */
const DAYS = [
  {id:1, ord:'اليوم الأول',  name:'يوم القرآني',   wk:'السبت'},
  {id:2, ord:'اليوم الثاني', name:'يوم خير جليس',  wk:'الأحد'},
  {id:3, ord:'اليوم الثالث', name:'يوم الحفظ',     wk:'الاثنين'},
  {id:4, ord:'اليوم الرابع', name:'يوم المهارات',  wk:'الثلاثاء'},
  {id:5, ord:'اليوم الخامس', name:'يوم المفتوح',   wk:'الأربعاء'}
];
const fullTitle = d => `${d.ord}: ${d.name} (${d.wk})`;

/* ===== Storage adapter (swap internals for Supabase later; keep the same API) ===== */
const Store = {
  prefix:'madinah:',
  get(k, fallback){ try{ const v=localStorage.getItem(this.prefix+k); return v===null?fallback:JSON.parse(v); }catch(e){ return fallback; } },
  set(k, v){ try{ localStorage.setItem(this.prefix+k, JSON.stringify(v)); }catch(e){} }
};

/* ===== State ===== */
const State = {
  activeDay: Store.get('activeDay', 1),
  theme: Store.get('theme', null)
};
const dayFromHash = () => { const m=/^#day-([1-5])$/.exec(location.hash); return m?+m[1]:null; };
function setDay(id, {updateHash=true}={}){
  State.activeDay = id; Store.set('activeDay', id); Nav.leaveGroup();
  if(updateHash && location.hash !== '#day-'+id) history.replaceState(null,'','#day-'+id);
  render();
}

const ACT_DAYS=[
  {id:1,label:'اليوم القرآني (السبت)',acts:['نشاط المقامات']},
  {id:2,label:'يوم خير جليس (الأحد)',acts:['النشاط الأول: مشهد وحكاية','النشاط الثاني: حياة المعصومين']},
  {id:3,label:'يوم الحفظ (الاثنين)',acts:['النشاط الأول: المونتاج','النشاط الثاني: ماراثون الحفظ']},
  {id:4,label:'يوم المهارات (الثلاثاء)',acts:['النشاط الأول: صوت وأثر','النشاط الثاني: البحث القرآني']},
  {id:5,label:'اليوم المفتوح (الأربعاء)',acts:['النشاط الأول: إدارة المشاريع','النشاط الثاني: كتاب في سطور']}
];
  const actKey=(d,i)=>d+'-'+i;
     const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 
function renderDayView(day){
  const dInfo = ACT_DAYS.find(x => x.id === day.id);
  const actNames = dInfo ? dInfo.acts : [];
  const fmtPts = v => Number.isInteger(v) ? v : +v.toFixed(2);

  if(!actNames.length){
    return `<section class="panel"><h2>${fullTitle(day)}</h2><p>لا توجد أنشطة مسجلة لهذا اليوم.</p></section>`;
  }

  const cards = actNames.map((actName, idx) => {
    const def = (State.acts && State.acts[actKey(day.id, idx)]) || {sup:'', crit:[]};
    const critList = def.crit || [];
    const eachPt = critList.length ? (10 / critList.length) : 0;

    const critHtml = critList.length
      ? `<ul class="day-act-list">${critList.map(c =>
          `<li><span>${esc(c.t || 'معيار بدون اسم')}</span><span class="day-act-pts">${fmtPts(eachPt)} درجة</span></li>`
        ).join('')}</ul>`
      : `<p class="g-meta">لم تُضف معايير لهذا النشاط بعد.</p>`;

    return `<article class="day-act-card">
      <h3>${esc(actName)}</h3>
      <p class="day-act-sup">مسؤول النشاط: ${def.sup && def.sup.trim() ? esc(def.sup) : 'غير محدد'}</p>
      ${critHtml}
    </article>`;
  }).join('');

  return `<section class="panel">
    <h2>${fullTitle(day)}</h2>
    <p>أنشطة اليوم ومعايير التقييم (المجموع لكل نشاط من 10 درجات)</p>
    <div class="day-acts">${cards}</div>
  </section>`;
}

/* ===== Render ===== */
function render(){
  const day = DAYS.find(d=>d.id===State.activeDay) || DAYS[0];
  document.getElementById('days').innerHTML = DAYS.map(d=>`
    <button class="day-chip" role="tab" data-day="${d.id}" aria-selected="${d.id===day.id}">
      <small>${d.ord}</small><strong>${d.name} · ${d.wk}</strong>
    </button>`).join('');
  document.getElementById('activeTitle').textContent = fullTitle(day);
  document.getElementById('view').innerHTML = renderDayView(day) + renderGrid();
  document.title = `أنشطة المدينة — ${day.name}`;
}
document.getElementById('days').addEventListener('click', e=>{
  const b=e.target.closest('[data-day]'); if(b) setDay(+b.dataset.day);
});
window.addEventListener('hashchange', ()=>Nav.route());

/* ===== Theme ===== */
function applyTheme(){
  if(State.theme) document.documentElement.setAttribute('data-theme', State.theme);
  else document.documentElement.removeAttribute('data-theme');
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const dark = State.theme ? State.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  State.theme = dark ? 'light' : 'dark'; Store.set('theme', State.theme); applyTheme();
});

/* ===== Live Saudi clock (Asia/Riyadh, UTC+3) ===== */
const fmt = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Riyadh',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const clockEl = document.getElementById('clock');
function tick(){ clockEl.textContent = fmt.format(new Date()).replace(/^24:/,'00:'); }
tick(); setInterval(tick, 1000);

/* ===== Groups data (stored; Prompt 3 will manage it) ===== */
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة','الحادية عشرة'];
const defaultGroups=()=>ORD.map((o,i)=>({id:i+1,name:'المجموعة '+(i+1),leader:{name:'',points:0},students:[]}));
State.groups=Store.get('groups',defaultGroups());

function demoGroups(){
  const N=['أحمد','محمد','عبدالله','يوسف','خالد','فهد','سلمان','ريان','عمر','سعد','تركي','ماجد','نواف','بدر','زياد','راكان','حمد','إبراهيم','صالح','طلال'];
  let s=7; const rnd=n=>{s=(s*9301+49297)%233280;return Math.floor(s/233280*n)};
  return ORD.map((o,i)=>({id:i+1,name:'المجموعة '+(i+1),
    leader:{name:'القائد '+N[(i*2)%N.length],points:rnd(70)},
    students:Array.from({length:5},(_,k)=>({id:i*10+k+1,name:N[(i*3+k*4+1)%N.length]+' '+N[(i+k*5+7)%N.length],points:rnd(60)}))}));
}

/* ===== Statistics logic ===== */
const num=v=>+v||0, fmtN=n=>n.toLocaleString('en-US');
const gTotal=g=>num(g.leader.points)+g.students.reduce((a,s)=>a+num(s.points),0)+(g.mgmtG||[]).reduce((a,m)=>a+num(m.pts),0);
function winners(){
  const gs=State.groups, mg=Math.max(0,...gs.map(gTotal)), ml=Math.max(0,...gs.map(g=>num(g.leader.points)));
  return {
    groups:mg>0?gs.filter(g=>gTotal(g)===mg):[],
    leaders:ml>0?gs.filter(g=>num(g.leader.points)===ml):[]
  }; /* ties share the star; nothing is awarded while all scores are 0 */
}
const star=t=>`<span class="badge-star">★ ${t}</span>`;

/* ===== Billboard ===== */
const ROTATE_MS=10000, TICK=100;
const bb={i:0,elapsed:0,paused:false};
const bbEl=document.getElementById('billboard');

function renderBillboard(){
  const gs=State.groups; if(!gs.length){bbEl.innerHTML='';return}
  bb.i=(bb.i+gs.length)%gs.length;
  const g=gs[bb.i], w=winners();
  const isBestG=w.groups.some(x=>x.id===g.id), isBestL=w.leaders.some(x=>x.id===g.id);
  const top=Math.max(0,...g.students.map(s=>num(s.points)));
  const stus=[...g.students].sort((a,b)=>num(b.points)-num(a.points));
  const bestNames=a=>a.length?a.map(x=>esc(x.name)).join('، '):'لم تُحتسب نقاط بعد';
  bbEl.innerHTML=`
  <div class="bb-head">
    <p class="bb-label">واجهة الإحصائيات · المجموعة ${bb.i+1} من ${gs.length}</p>
    <div class="bb-nav">
      <button class="bb-arrow" data-act="next" aria-label="المجموعة التالية">›</button>
      <button class="bb-arrow" data-act="prev" aria-label="المجموعة السابقة">‹</button>
    </div>
  </div>
  <div class="bb-progress" aria-hidden="true"><i id="bbBar"></i></div>
  <div class="bb-stage" id="bbStage"><article class="bb-card${isBestG?' is-best':''}">
    <div class="bb-top">
      <div><h2 class="bb-gname"><a class="bb-link" href="#group-${g.id}">${esc(g.name)}</a></h2>${isBestG?star('أفضل مجموعة'):''}</div>
      <div class="bb-total"><b>${fmtN(gTotal(g))}</b><span>مجموع نقاط المجموعة</span></div>
    </div>
    <div class="bb-leader${isBestL?' is-best':''}">
      <div><span class="bb-role">قائد المجموعة</span><span class="bb-pname">${g.leader.name?esc(g.leader.name):'لم يُحدد القائد بعد'}</span></div>
      ${isBestL?star('أفضل قائد'):''}
      <span class="pts">${fmtN(num(g.leader.points))}<small>نقطة</small></span>
    </div>
    ${stus.length?`<ul class="bb-students">${stus.map(s=>{const b=top>0&&num(s.points)===top;return `
      <li class="stu${b?' is-best':''}"><span class="bb-pname">${esc(s.name)}</span>${b?star('أفضل طالب في المجموعة'):''}<span class="pts">${fmtN(num(s.points))}<small>نقطة</small></span></li>`}).join('')}</ul>`
    :'<div class="bb-empty">لا يوجد طلاب في هذه المجموعة بعد.</div>'}
  </article>
  <div class="bb-spot">
    <div class="spot">${star('أفضل مجموعة')} <b>${bestNames(w.groups)}</b></div>
    <div class="spot">${star('أفضل قائد')} <b>${w.leaders.length?w.leaders.map(x=>esc(x.leader.name||'—')).join('، '):'لم تُحتسب نقاط بعد'}</b></div>
  </div>
  </div><div class="bb-dots">${gs.map((x,k)=>`<button class="bb-dot" data-go="${k}" aria-label="${esc(x.name)}" ${k===bb.i?'aria-current="true"':''}></button>`).join('')}</div>
  <div class="bb-tools">
    <button data-act="demo" type="button">تحميل بيانات تجريبية</button>
    <button data-act="reset" type="button">تصفير البيانات</button>
  </div>`;
  paintBar();
}
function paintBar(){const b=document.getElementById('bbBar'); if(b)b.style.width=Math.min(100,bb.elapsed/ROTATE_MS*100)+'%'}
/* graduated blue progression: deep → ocean → deep, accents lighten at the ocean peak (every step is adjacent, wrap-around included) */
const BB_PAL=[['#03045e','#00b4d8'],['#023e8a','#48cae4'],['#023e8a','#90e0ef'],['#0077b6','#ade8f4'],['#0077b6','#90e0ef'],['#023e8a','#48cae4'],['#03045e','#00b4d8'],['#03045e','#48cae4'],['#023e8a','#90e0ef'],['#0077b6','#48cae4'],['#023e8a','#00b4d8']];
function applyBb(i){const p=BB_PAL[((i%BB_PAL.length)+BB_PAL.length)%BB_PAL.length]; bbEl.style.setProperty('--bb-bg',p[0]); bbEl.style.setProperty('--bb-ac',p[1]);}
const _rb=renderBillboard;
renderBillboard=function(){_rb(); applyBb(bb.i);};
function goTo(i){
  const n=State.groups.length||1, st=document.getElementById('bbStage');
  if(bb.busy) return;
  const dir=i>bb.i?1:-1;
  bb.elapsed=0; paintBar(); applyBb(((i%n)+n)%n);
  if(!st||matchMedia('(prefers-reduced-motion: reduce)').matches){bb.i=i; renderBillboard(); return;}
  bb.busy=true;
  st.style.setProperty('--gx',(-dir*26)+'px'); st.classList.add('bb-out');
  setTimeout(()=>{
    bb.i=i; renderBillboard();
    const s=document.getElementById('bbStage'); if(s){s.style.setProperty('--gx',(dir*26)+'px'); s.classList.add('bb-in');}
    bb.busy=false;
  },320);
}
setInterval(()=>{
  if(bb.paused||document.hidden)return;
  bb.elapsed+=TICK;
  if(bb.elapsed>=ROTATE_MS)goTo(bb.i+1);else paintBar();
},TICK);

bbEl.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'), d=e.target.closest('[data-go]');
  if(d)return goTo(+d.dataset.go);
  if(!a)return;
  if(a.dataset.act==='next')goTo(bb.i+1);
  else if(a.dataset.act==='prev')goTo(bb.i-1);
  else{State.groups=a.dataset.act==='demo'?demoGroups():defaultGroups();save();goTo(0)}
});
bbEl.addEventListener('mouseenter',()=>bb.paused=true);
bbEl.addEventListener('mouseleave',()=>bb.paused=false);
bbEl.addEventListener('focusin',()=>bb.paused=true);
bbEl.addEventListener('focusout',()=>bb.paused=false);
window.addEventListener('storage',e=>{if(e.key===Store.prefix+'groups'){State.groups=Store.get('groups',defaultGroups());renderBillboard()}});
renderBillboard();

/* ===== Group grid + detail view navigation ===== */
const viewEl=document.getElementById('view'), detailEl=document.getElementById('detail');
const anim=(el,dx=0)=>{el.style.setProperty('--dx',dx+'px');el.classList.remove('view-enter');void el.offsetWidth;el.classList.add('view-enter')};
const dName=g=>g.name.trim()||'مجموعة بلا اسم';
const curG=()=>State.groups.find(x=>x.id===Nav.gid);
let save = () => {
  Store.set('groups', State.groups);
  if (window.CloudSync) CloudSync.schedulePush();
};
function renderGrid(){
  const w=winners();
  return `<section><h2 class="sec-title">مجموعات البرنامج</h2><div class="grid">`+State.groups.map(g=>{
    const best=w.groups.some(x=>x.id===g.id);
    return `<article class="g-card${best?' is-best':''}"><h3>${esc(dName(g))}</h3>${best?`<div>${star('أفضل مجموعة')}</div>`:''}
      <p class="g-meta">القائد: ${g.leader.name?esc(g.leader.name):'لم يُحدد بعد'}</p>
      <p class="g-meta">عدد الطلاب: ${g.students.length}</p>
      <div class="g-foot"><span class="pts">${fmtN(gTotal(g))}<small>نقطة</small></span><a class="btn" href="#group-${g.id}">إظهار تفاصيل المجموعة</a></div></article>`}).join('')+`</div></section>`;
}

const Nav={
  view:'home', gid:null, homeY:0,
  route(){
    const m=/^#group-(\d+)$/.exec(location.hash), g=m&&State.groups.find(x=>x.id===+m[1]);
    if(g) return this.openGroup(g.id);
    const d=dayFromHash();
    if(d&&d!==State.activeDay) setDay(d,{updateHash:false}); else this.leaveGroup();
  },
  openGroup(id){
    const fromHome=this.view==='home';
    if(fromHome) this.homeY=window.scrollY;
    this.gid=id; this.view='group';
    bbEl.hidden=true; viewEl.hidden=true; detailEl.hidden=false;
    document.title='أنشطة المدينة — '+dName(curG());
    this.renderDetail(0,fromHome);
    if(fromHome) window.scrollTo(0,0);
  },
  switchTo(id,dir){
    this.gid=id; history.replaceState(null,'','#group-'+id);
    document.title='أنشطة المدينة — '+dName(curG());
    this.renderDetail(dir);
  },
  step(d){const gs=State.groups,i=gs.findIndex(x=>x.id===this.gid);this.switchTo(gs[(i+d+gs.length)%gs.length].id,d)},
  goHome(){location.hash='#day-'+State.activeDay},
  leaveGroup(){
    if(this.view==='home') return;
    this.view='home'; detailEl.hidden=true; bbEl.hidden=false; viewEl.hidden=false;
    render(); renderBillboard(); anim(bbEl); anim(viewEl);
    window.scrollTo(0,this.homeY);
  },
  renderDetail(dir=0,animate=true){
    const gs=State.groups, g=curG(), best=winners().groups.some(x=>x.id===g.id);
    detailEl.innerHTML=`
    <div class="d-bar">
      <button class="btn btn-ghost" data-act="home" type="button">العودة للرئيسية</button>
      <div class="d-switch">
        <button class="btn btn-ghost" data-act="prev" type="button">المجموعة السابقة</button>
        <select id="dSel" aria-label="اختيار المجموعة">${gs.map(x=>`<option value="${x.id}"${x.id===g.id?' selected':''}>${esc(dName(x))}</option>`).join('')}</select>
        <button class="btn btn-ghost" data-act="next" type="button">المجموعة التالية</button>
      </div>
    </div>
    <div class="d-team${best?' is-best':''}" id="dTeam">
      <div><span class="d-lab">اسم الفريق</span><h2 id="dName">${esc(dName(g))}</h2><button class="btn btn-ghost d-edit" data-act="editName" type="button">تعديل الاسم</button><span id="dStar">${best?star('أفضل مجموعة'):''}</span></div>
      <div class="bb-total"><b id="dTotal">${fmtN(gTotal(g))}</b><span>مجموع نقاط المجموعة</span></div>
    </div>
    <h2 class="d-day">${fullTitle(DAYS.find(d=>d.id===State.activeDay)||DAYS[0])}</h2>
    <div class="d-cols">
      <section class="d-col" aria-label="بيانات المجموعة"><h3 class="d-head">إدارة الفريق والطلاب</h3>
        <label class="d-fld">اسم المجموعة<input class="d-in" id="dNameIn" value="${esc(g.name)}"></label>
        <div class="d-fld d-leader" data-drop="l">قائد المجموعة <small class="d-hint">اسحب طالباً هنا لتعيينه قائداً</small>
          <div class="d-row"><span class="d-grip" data-drag="l" role="img" aria-label="سحب القائد">⋮⋮</span><input class="d-in" id="dLeader" placeholder="اسم القائد" value="${esc(g.leader.name)}" aria-label="اسم القائد"><input class="d-in d-pts" id="dLeaderPts" type="number" min="0" readonly title="تُحسب تلقائياً من التقييمات" value="${num(g.leader.points)}" aria-label="نقاط القائد"></div></div>
        <h3>الطلاب (${g.students.length})</h3>
        ${g.students.length?`<ul class="d-list">${g.students.map(s=>`<li class="d-row" data-sid="${s.id}" data-drop="s"><span class="d-grip" data-drag="s:${s.id}" role="img" aria-label="سحب الطالب">⋮⋮</span><input class="d-in" data-sid="${s.id}" data-f="name" value="${esc(s.name)}" aria-label="اسم الطالب"><input class="d-in d-pts" type="number" min="0" readonly title="تُحسب تلقائياً من التقييمات" data-sid="${s.id}" data-f="points" value="${num(s.points)}" aria-label="نقاط الطالب"><button class="d-rm" data-act="rm" data-sid="${s.id}" type="button" aria-label="حذف الطالب">×</button></li>`).join('')}</ul>`:'<div class="bb-empty" style="color:var(--text-soft)">لا يوجد طلاب بعد.</div>'}
        <div class="d-row"><input class="d-in" id="dAdd" placeholder="اسم طالب جديد"><button class="btn" data-act="add" type="button">إضافة طالب</button></div>
      </section>
      <section class="d-col" id="dEval" aria-label="التقييمات"><h3>التقييمات والنماذج</h3><p>سيُضاف هذا القسم في الخطوة القادمة.</p></section>
    </div>`;
    detailEl.insertAdjacentHTML('beforeend',`<div class="d-tray" id="dTray" hidden><span>نقل الطالب إلى:</span>${gs.filter(x=>x.id!==g.id).map(x=>`<button class="d-chip" type="button" tabindex="-1" data-drop="g:${x.id}">${esc(dName(x))}</button>`).join('')}</div>`);
    renderEval();
    if(animate) anim(detailEl,-dir*16);
  }
};
function metaRefresh(g){
  const best=winners().groups.some(x=>x.id===g.id);
  document.getElementById('dTotal').textContent=fmtN(gTotal(g));
  document.getElementById('dStar').innerHTML=best?star('أفضل مجموعة'):'';
  document.getElementById('dTeam').classList.toggle('is-best',best);
}
detailEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act, g=curG();
  if(a==='editName'){const i=document.getElementById('dNameIn');i.scrollIntoView({block:'center'});i.focus();i.select();}
  else if(a==='home') Nav.goHome();
  else if(a==='prev') Nav.step(-1);
  else if(a==='next') Nav.step(1);
  else if(a==='add'){const i=document.getElementById('dAdd'),v=i.value.trim(); if(!v){i.focus();return} g.students.push({id:Date.now(),name:v,points:0}); save(); Nav.renderDetail(0,false); document.getElementById('dAdd').focus();}
  else if(a==='rm'){const delId=b.dataset.sid; g.students=g.students.filter(s=>String(s.id)!==String(delId)); CloudSync.deleteMember(delId); save(); Nav.renderDetail(0,false);}
});
detailEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dAdd')detailEl.querySelector('[data-act="add"]').click()});
detailEl.addEventListener('change',e=>{
  if(e.target.id!=='dSel') return;
  const gs=State.groups, to=+e.target.value, d=Math.sign(gs.findIndex(x=>x.id===to)-gs.findIndex(x=>x.id===Nav.gid));
  Nav.switchTo(to,d);
});
detailEl.addEventListener('input',e=>{

/* ===== Drag & drop (pointer events: mouse + touch) ===== */
function applyDrop(S,t){
  const g=curG(), idx=id=>g.students.findIndex(s=>String(s.id)===String(id));
  const si=S.isL?-1:idx(S.id.slice(2));
  if(t.kind==='g'){
    const to=State.groups.find(x=>x.id===t.id); if(S.isL||!to||si<0) return false;
    to.students.push(g.students.splice(si,1)[0]); return true;
  }
  if(t.kind==='l'){
    if(S.isL||si<0) return false;
    const s=g.students[si], old=g.leader; g.leader={name:s.name,points:s.points,evals:s.evals};
    if(old.name.trim()) g.students[si]={id:s.id,name:old.name,points:old.points,evals:old.evals}; else g.students.splice(si,1);
    return true;
  }
  const ti=idx(t.id); if(ti<0) return false;
  if(S.isL){const s=g.students[ti], old=g.leader; g.leader={name:s.name,points:s.points,evals:s.evals}; g.students[ti]={id:s.id,name:old.name,points:old.points,evals:old.evals}; return true;}
  if(si===ti) return false;
  const [s]=g.students.splice(si,1); let ni=idx(t.id); if(t.after) ni++; g.students.splice(ni,0,s); return true;
}
detailEl.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-drag]'); if(!h||(e.pointerType==='mouse'&&e.button!==0)) return;
  const g=curG(), isL=h.dataset.drag==='l';
  const src=isL?g.leader:g.students.find(s=>String(s.id)===String(h.dataset.drag.slice(2)));
  if(!src||!src.name.trim()) return;
  e.preventDefault();
  const S={id:h.dataset.drag,isL}, row=h.closest('.d-row');
  const ghost=document.createElement('div'); ghost.className='d-ghost'; ghost.textContent=src.name; document.body.appendChild(ghost);
  row.classList.add('dragging'); document.getElementById('dTray').hidden=false;
  h.setPointerCapture(e.pointerId);
  let t=null;
  const clear=()=>detailEl.querySelectorAll('.drop-hot,.drop-before,.drop-after').forEach(n=>n.classList.remove('drop-hot','drop-before','drop-after'));
  const move=ev=>{
    ghost.style.left=ev.clientX+14+'px'; ghost.style.top=ev.clientY-22+'px';
    if(ev.clientY<70) scrollBy(0,-14); else if(ev.clientY>innerHeight-130) scrollBy(0,14);
    clear(); t=null;
    const el=document.elementFromPoint(ev.clientX,ev.clientY), d=el&&el.closest('[data-drop]'); if(!d) return;
    const k=d.dataset.drop;
    if(k==='l'){ if(isL) return; t={kind:'l'}; d.classList.add('drop-hot'); }
    else if(k[0]==='g'){ if(isL) return; t={kind:'g',id:+k.slice(2)}; d.classList.add('drop-hot'); }
    else { const id=d.dataset.sid; if(!isL&&String(id)===String(S.id.slice(2))) return; const r=d.getBoundingClientRect(), after=ev.clientY>r.top+r.height/2; t={kind:'s',id,after}; d.classList.add(isL?'drop-hot':after?'drop-after':'drop-before'); }
  };
  const end=ev=>{
    h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',end); h.removeEventListener('pointercancel',end);
    ghost.remove(); clear(); row.classList.remove('dragging'); document.getElementById('dTray').hidden=true;
    if(ev.type==='pointerup'&&t&&applyDrop(S,t)){save(); Nav.renderDetail(0,false);}
  };
  h.addEventListener('pointermove',move); h.addEventListener('pointerup',end); h.addEventListener('pointercancel',end);
  move(e);
});

  const l=p.evals&&p.evals[day]&&p.evals[day].lead&&p.evals[day].lead[kind], sc=lScore(l,kind,day);
  const dayObj=DAYS.find(d=>d.id===day)||DAYS[0], who=p.name.trim()||'القائد (لم يُحدد الاسم بعد)';
  const rows=def.crit.length?def.crit.map(c=>`<tr><td><input class="d-in" data-lt="${c.id}" value="${esc(c.t)}" aria-label="اسم الفعل"></td><td class="c"><input type="checkbox" data-lc="${c.id}" aria-label="${esc(c.t)}"${l&&l.c&&l.c[c.id]?' checked':''}></td><td><input class="d-in" data-ln="${c.id}" value="${esc((l&&l.n&&l.n[c.id])||'')}" placeholder="ملاحظة" aria-label="ملاحظات"></td><td><button class="d-rm" type="button" data-ldel="${c.id}" aria-label="حذف الفعل">×</button></td></tr>`).join(''):'<tr><td colspan="4" style="text-align:center;color:var(--text-soft)">لم تُضف أفعال لهذا القسم بعد.</td></tr>';
  return `<div class="act-head"><h3>${LEAD_TITLES[kind]}</h3><p class="act-title">${fullTitle(dayObj)}</p></div>
  <div class="ev-score"><span>درجة ${LEAD_TITLES[kind]}: ${esc(who)}</span><b id="lScore">${sc} / 10</b></div>
  <div class="ev-wrap"><table class="ev-table"><thead><tr><th>الأفعال</th><th class="c">التقييم (صح)</th><th>ملاحظات</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="d-row"><input class="d-in" id="lNew" placeholder="اسم الفعل الجديد"${def.crit.length>=10?' disabled':''}><button class="btn" type="button" data-ladd="1"${def.crit.length>=10?' disabled':''}>+ إضافة فعل</button></div>
  <span class="act-count">عدد الأفعال: ${def.crit.length} / 10</span>`;
}
const lDef=key=>State.lacts[key]||(State.lacts[key]={crit:[]});
detailEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-ladd],[data-ldel]'); if(!b) return;
  const kind=Eval.sub.leader, def=lDef(kind+'-'+State.activeDay);
  if(b.dataset.ladd){
    const i=document.getElementById('lNew'), v=i.value.trim();
    if(!v){i.focus();return} if(def.crit.length>=10) return;
    def.crit.push({id:'a'+Date.now(),t:v}); saveLacts(); renderEval(); document.getElementById('lNew')?.focus();
  } else {
    def.crit=def.crit.filter(c=>c.id!==b.dataset.ldel); saveLacts(); recalcAll(); renderEval(); syncPts(curG()); metaRefresh(curG());
  }
});
detailEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lNew')detailEl.querySelector('[data-ladd]').click()});
detailEl.addEventListener('change',e=>{
  const t=e.target; if(t.dataset.lc===undefined) return;
  const g=curG(); if(!g) return; const p=g.leader, kind=Eval.sub.leader, day=State.activeDay;
  ensureLead(p,day,kind).c[t.dataset.lc]=t.checked; p.points=scoreOf(p); save();
  document.getElementById('lScore').textContent=lScore(p.evals[day].lead[kind],kind,day)+' / 10';
  syncPts(g); metaRefresh(g);
});
detailEl.addEventListener('input',e=>{
  const t=e.target, kind=Eval.sub.leader, day=State.activeDay;
  if(t.dataset.lt!==undefined){const c=lDef(kind+'-'+day).crit.find(x=>x.id===t.dataset.lt); if(c){c.t=t.value; saveLacts();}}
  else if(t.dataset.ln!==undefined){const g=curG(); if(g){ensureLead(g.leader,day,kind).n[t.dataset.ln]=t.value; save();}}
});

/* ===== Backup: export / import (text-based, works inside the published page) ===== */
(()=>{
  const $=id=>document.getElementById(id), ta=$('bkText'), act=$('bkActions'), msg=$('bkMsg');
  const show=(txt,m)=>{ta.hidden=false;act.hidden=false;ta.value=txt;msg.textContent=m};
  $('bkExport').addEventListener('click',()=>{
    show(JSON.stringify({v:1,groups:State.groups,acts:State.acts,lacts:State.lacts,activeDay:State.activeDay},null,1),'انسخ هذا النص واحفظه في ملف أو ملاحظات لتسترده لاحقاً.');
    ta.focus(); ta.select();
  });
  $('bkImport').addEventListener('click',()=>{show('','الصق نص النسخة الاحتياطية هنا ثم اضغط «تطبيق الاستيراد». ستُستبدل بياناتك الحالية.');ta.focus()});
  $('bkCopy').addEventListener('click',async()=>{
    ta.select();
    try{await navigator.clipboard.writeText(ta.value); msg.textContent='تم نسخ النص.'}catch(e){try{document.execCommand('copy'); msg.textContent='تم نسخ النص.'}catch(_){msg.textContent='تعذّر النسخ تلقائياً، حدّد النص وانسخه يدوياً.'}}
  });
  $('bkApply').addEventListener('click',()=>{
    try{
      const d=JSON.parse(ta.value);
      if(!d||!Array.isArray(d.groups)||!d.groups.length||!d.groups.every(g=>g&&g.leader&&Array.isArray(g.students))) throw new Error('bad');
      State.groups=d.groups; State.acts=d.acts||{}; State.lacts=d.lacts||{};
      Store.set('groups',State.groups); saveActs(); saveLacts();
      Eval.sid=null; bb.i=0; bb.elapsed=0;
      history.replaceState(null,'','#day-'+State.activeDay); Nav.leaveGroup(); render(); renderBillboard();
      msg.textContent='تم استيراد البيانات بنجاح.';
    }catch(e){msg.textContent='النص غير صالح. تأكد أنك لصقت نسخة من «تصدير نسخة احتياطية» كاملة.'}
  });
})();





/* ===== Boot ===== */
applyTheme();
setDay(dayFromHash() || State.activeDay, {updateHash:!!dayFromHash()});
Nav.route();

function refreshVisibleUI(){
  if (typeof render === 'function') render();
  if (typeof renderBillboard === 'function') renderBillboard();
  if (typeof Nav !== 'undefined' && Nav.view === 'group') Nav.renderDetail(0, false);
}

document.getElementById('syncNowBtn')?.addEventListener('click', async () => {
  CloudSync.setStatus('جاري المزامنة...', '');
  await CloudSync.pushAll();
  await CloudSync.pullAll(false);
  refreshVisibleUI();
});

(async () => {
  await CloudSync.pullAll(true);
  refreshVisibleUI();
  CloudSync.subscribeRealtime();
})();
</script>
</body>
</html>
